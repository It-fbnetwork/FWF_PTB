<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FWF Photo Check-in</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="shell shell--narrow">
      <p class="brand">FACE WASH FOX</p>
      <h1>PHOTO CHECK-IN</h1>
      <p class="lead">Điền thông tin để vào hàng chờ chụp ảnh.</p>

      <section class="gallery" aria-label="Không gian Face Wash Fox Vincom Đồng Khởi">
        <figure class="shot"><img src="/vincom/MT1.jpg" alt="Mặt tiền Face Wash Fox" loading="lazy" /></figure>
        <figure class="shot"><img src="/vincom/S1.jpg" alt="Tường thương hiệu Face Wash Fox" loading="lazy" /></figure>
        <figure class="shot"><img src="/vincom/S9.jpg" alt="Góc trang trí Face Wash Fox" loading="lazy" /></figure>
        <figure class="shot"><img src="/vincom/S5.jpg" alt="Khu vực chờ Face Wash Fox" loading="lazy" /></figure>
      </section>

      <form id="checkin-form" class="panel">
        <p id="error" class="error" hidden></p>

        <label for="name">Họ và tên</label>
        <input id="name" name="name" type="text" autocomplete="name" required maxlength="80" />

        <label for="phone">Số điện thoại</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" required maxlength="20" />

        <label class="consent">
          <input id="consent" name="consent" type="checkbox" required />
          <span>Tôi đồng ý với điều khoản sử dụng hình ảnh của Face Wash Fox.</span>
        </label>

        <button class="btn" type="submit" id="submit">CHECK-IN</button>
      </form>
    </main>

    <aside class="atmosphere" aria-hidden="true">
      <div class="atmosphere__rail atmosphere__rail--left">
        <figure class="shot"><img src="/vincom/MT2.jpg" alt="" loading="lazy" /></figure>
        <figure class="shot"><img src="/vincom/S8.jpg" alt="" loading="lazy" /></figure>
      </div>
      <div class="atmosphere__rail atmosphere__rail--right">
        <figure class="shot"><img src="/vincom/S2.jpg" alt="" loading="lazy" /></figure>
        <figure class="shot"><img src="/vincom/MT4.jpg" alt="" loading="lazy" /></figure>
      </div>
    </aside>
    <script src="/checkin.js" type="module"></script>
  </body>
</html>
