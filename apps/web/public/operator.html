<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FWF Operator</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <main class="shell">
      <div class="top-links">
        <a href="/display">Display</a>
        <a href="/checkin">Check-in</a>
      </div>

      <p class="brand">FACE WASH FOX</p>
      <h1>PHOTO BOOTH OPERATOR</h1>
      <p class="lead">Chọn khách trước khi chụp. Ảnh mới sẽ gắn đúng active session.</p>

      <section class="gallery gallery--compact" aria-label="Không gian Face Wash Fox Vincom Đồng Khởi">
        <figure class="shot"><img src="/vincom/MT1.jpg" alt="Mặt tiền cửa hàng" loading="lazy" /></figure>
        <figure class="shot"><img src="/vincom/S1.jpg" alt="Tường thương hiệu" loading="lazy" /></figure>
        <figure class="shot"><img src="/vincom/S9.jpg" alt="Góc trang trí" loading="lazy" /></figure>
        <figure class="shot"><img src="/vincom/S5.jpg" alt="Khu vực chờ" loading="lazy" /></figure>
      </section>

      <section id="active" class="active-banner" hidden></section>

      <section class="panel">
        <h2 style="font-size: 1rem; letter-spacing: 0.08em; margin-bottom: 1rem; color: var(--fwf-amber)">
          WAITING QUEUE
        </h2>
        <div id="queue" class="queue"></div>
        <p id="empty" class="empty" hidden>Chưa có khách check-in.</p>
      </section>

      <section class="panel" style="margin-top: 1rem">
        <h2 style="font-size: 1rem; letter-spacing: 0.08em; margin-bottom: 1rem; color: var(--fwf-amber)">
          RECENT / OTHER
        </h2>
        <div id="recent" class="queue"></div>
      </section>
    </main>

    <div id="photo-modal" class="photo-modal" hidden>
      <div class="photo-modal__backdrop" data-action="close-modal"></div>
      <div class="photo-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="photo-modal-title">
        <div class="photo-modal__header">
          <div>
            <p class="brand" style="margin-bottom: 0.2rem">FACE WASH FOX</p>
            <h2 id="photo-modal-title" class="photo-modal__title">Ảnh khách</h2>
            <p id="photo-modal-sub" class="queue-sub"></p>
          </div>
          <button type="button" class="btn btn--ghost" data-action="close-modal">ĐÓNG</button>
        </div>
        <div id="photo-modal-body" class="photo-modal__body"></div>
      </div>
    </div>

    <script src="/assets/operator.js" type="module"></script>
  </body>
</html>
