<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FWF Photo Check-in</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <main class="shell shell--narrow">
      <p class="brand">FACE WASH FOX</p>
      <h1 class="checkin-title">Foxie điền thông tin để check-in trải nghiệm FOX Studio nhé!</h1>

      <form id="checkin-form" class="panel">
        <p id="error" class="error" hidden></p>

        <label for="name">Họ và tên</label>
        <input id="name" name="name" type="text" autocomplete="name" required maxlength="80" />

        <label for="phone">Số điện thoại</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" required maxlength="20" />

        <section class="gallery gallery--compact storefront-gallery" aria-label="Mặt tiền Face Wash Fox">
          <figure class="shot"><img src="/vincom/MT1.jpg" alt="Mặt tiền Face Wash Fox 1" loading="lazy" /></figure>
          <figure class="shot"><img src="/vincom/MT2.jpg" alt="Mặt tiền Face Wash Fox 2" loading="lazy" /></figure>
          <figure class="shot"><img src="/vincom/MT3.jpg" alt="Mặt tiền Face Wash Fox 3" loading="lazy" /></figure>
          <figure class="shot"><img src="/vincom/MT4.jpg" alt="Mặt tiền Face Wash Fox 4" loading="lazy" /></figure>
        </section>

        <label class="consent">
          <input id="consent" name="consent" type="checkbox" required />
          <span>Tôi đồng ý với điều khoản sử dụng hình ảnh của Face Wash Fox.</span>
        </label>

        <button class="btn btn--center" type="submit" id="submit">CHECK-IN</button>
      </form>
    </main>
    <script src="/assets/checkin.js" type="module"></script>
  </body>
</html>
