<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FWF Session</title>
    <link rel="stylesheet" href="/assets/app.css?v=share-1" />
  </head>
  <body class="page-session">
    <main class="shell shell--narrow">
      <div class="top-links">
        <a href="/checkin" id="back-link">← Quay lại check-in</a>
      </div>

      <p class="brand">FACE WASH FOX</p>
      <h1 id="title" class="title-session" hidden>CHECK-IN THÀNH CÔNG</h1>

      <p class="lead session-ready-text" id="lead">Fox Studio đã sẵn sàng, mời Foxie đến khu vực chụp hình để thả dáng!</p>

      <section id="frame-step" class="panel frame-step">
        <div id="frame-loading" class="frame-loading" hidden>
          <span class="frame-loading__spinner" aria-hidden="true"></span>
          <span>Đang chọn frame…</span>
        </div>
        <fieldset class="frame-picker" aria-label="Chọn frame chụp ảnh">
          <legend>Chọn frame ảnh</legend>
          <label class="frame-choice">
            <input type="radio" name="selectedFrameId" value="frame-1" />
            <span><img src="/frames/frame-1.png" alt="Frame 1" loading="lazy" /></span>
          </label>
          <label class="frame-choice">
            <input type="radio" name="selectedFrameId" value="frame-2" />
            <span><img src="/frames/frame-2.png" alt="Frame 2" loading="lazy" /></span>
          </label>
          <label class="frame-choice">
            <input type="radio" name="selectedFrameId" value="frame-3" />
            <span><img src="/frames/frame-3.png" alt="Frame 3" loading="lazy" /></span>
          </label>
          <label class="frame-choice">
            <input type="radio" name="selectedFrameId" value="frame-4" />
            <span><img src="/frames/frame-4.png" alt="Frame 4" loading="lazy" /></span>
          </label>
          <label class="frame-choice">
            <input type="radio" name="selectedFrameId" value="frame-5" />
            <span><img src="/frames/frame-5.png" alt="Frame 5" loading="lazy" /></span>
          </label>
        </fieldset>
        <button id="capture-button" class="btn btn--center capture-button" type="button">CHỤP ẢNH</button>
        <p id="capture-status" class="capture-status" aria-live="polite"></p>
      </section>

      <section class="panel">
        <p class="guest-owner" id="name">Ảnh này của —</p>

        <div class="photo-slot" id="photo-slot">
          <div class="photo-placeholder" id="photo-placeholder">
            <p class="photo-placeholder__text">Ảnh của bạn sẽ <br></br> xuất hiện tại đây nhé</p>
            <span class="status-pill" id="status">WAITING</span>
          </div>
          <img id="photo" class="photo-preview" alt="Ảnh Face Wash Fox của bạn" hidden />
        </div>
      </section>
    </main>

    <div id="actions" class="download-fab" hidden>
      <a
        class="download-fab__btn"
        id="download"
        href="#"
        download
        aria-label="Tải ảnh về"
        title="Tải ảnh về"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path
            fill="currentColor"
            d="M12 3a1 1 0 0 1 1 1v9.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42L11 13.59V4a1 1 0 0 1 1-1Zm-7 14a1 1 0 0 1 1 1v1h12v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Z"
          />
        </svg>
      </a>
      <button
        class="download-fab__btn"
        id="share"
        type="button"
        aria-label="Chia sẻ ảnh"
        title="Chia sẻ ảnh"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path
            fill="currentColor"
            d="M18 16a3 3 0 0 0-2.39 1.19L8.91 13.8a3.07 3.07 0 0 0 0-1.6l6.7-3.39A3 3 0 1 0 15 7a2.9 2.9 0 0 0 .09.72L8.4 11.1a3 3 0 1 0 0 3.8l6.69 3.38A2.9 2.9 0 0 0 15 19a3 3 0 1 0 3-3Z"
          />
        </svg>
      </button>
    </div>
    <p id="share-feedback" class="share-feedback" role="status" aria-live="polite" hidden></p>
    <script src="/assets/session.js?v=share-1" type="module"></script>
  </body>
</html>
