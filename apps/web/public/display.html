<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FWF Photo Booth Display</title>
    <link rel="stylesheet" href="/assets/fonts.css?v=poppins-1" />
    <link rel="stylesheet" href="/assets/display.css?v=display-qr-1" />
  </head>
  <body>
    <main id="stage" class="stage" aria-live="polite">
      <div class="panel">
        <section id="idle" class="idle is-visible" aria-label="Idle screen">
          <div class="idle__slides" id="idle-slides" aria-hidden="true"></div>
          <div class="idle__veil" aria-hidden="true"></div>
          <div class="idle__glow" aria-hidden="true"></div>
          <div class="idle__frame">
            <h1 class="idle__title">FOX<br />STUDIOS</h1>
            <p class="idle__hint">Chào mừng Foxie<br />đến với Face Wash Fox<br />Vincom Đồng Khởi</p>
            <img class="idle__qr" src="/assets/display-qr.png" alt="QR code check-in Face Wash Fox" />
          </div>
        </section>

        <section id="photo" class="photo" aria-label="Photo display" hidden>
          <img id="photo-image" class="photo__image" alt="FWF photo booth capture" />
        </section>

        <section id="frame-preview" class="frame-preview" aria-label="Frame preview" hidden>
          <video id="frame-preview-live" class="frame-preview__live" autoplay playsinline muted></video>
          <img id="frame-preview-image" class="frame-preview__image" alt="Selected photo frame preview" />
          <div id="camera-status" class="camera-status" hidden></div>
        </section>

        <div id="capture-countdown" class="capture-countdown" hidden aria-live="assertive"></div>

      </div>
    </main>

    <script src="/assets/display.js?v=remote-capture-1" type="module"></script>
  </body>
</html>
